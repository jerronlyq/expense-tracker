<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2040"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <linearGradient id="dStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a5a78" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#46b8d4" stop-opacity="0.95"/>
    </linearGradient>

    <clipPath id="dClip">
      <polygon points="16,3.5 28.5,16 16,28.5 3.5,16"/>
    </clipPath>

    <filter id="signGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#06090f"/>

  <!-- Outer ambient halo -->
  <polygon
    points="16,1 31,16 16,31 1,16"
    fill="none"
    stroke="rgba(70,184,212,0.1)"
    stroke-width="1"
    filter="url(#ambientGlow)"
  />

  <!-- Diamond body -->
  <polygon
    points="16,3.5 28.5,16 16,28.5 3.5,16"
    fill="url(#dFill)"
    stroke="url(#dStroke)"
    stroke-width="1.3"
  />

  <!-- $ sign centred inside diamond with glow -->
  <g clip-path="url(#dClip)" filter="url(#signGlow)">
    <text
      x="16"
      y="21"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      font-weight="900"
      fill="#46b8d4"
    >$</text>
  </g>
</svg>
